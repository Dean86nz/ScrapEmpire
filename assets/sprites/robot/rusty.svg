<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Rusty, Platzhalter. Top-down, blickt nach rechts (+X). -->
  <!-- Ketten links/rechts -->
  <rect x="10" y="6" width="44" height="12" rx="6" fill="#4A4A55" stroke="#2A2A33" stroke-width="3"/>
  <rect x="10" y="46" width="44" height="12" rx="6" fill="#4A4A55" stroke="#2A2A33" stroke-width="3"/>
  <!-- Körper -->
  <rect x="8" y="12" width="48" height="40" rx="14" fill="#F28C28" stroke="#2A2A33" stroke-width="4"/>
  <!-- Glanzfleck -->
  <ellipse cx="22" cy="22" rx="7" ry="4" fill="#FFC27A" opacity="0.8"/>
  <!-- Augen (nach rechts gerichtet) -->
  <circle cx="38" cy="26" r="6.5" fill="#FFFFFF" stroke="#2A2A33" stroke-width="3"/>
  <circle cx="38" cy="38" r="6.5" fill="#FFFFFF" stroke="#2A2A33" stroke-width="3"/>
  <circle cx="40" cy="26" r="2.5" fill="#2A2A33"/>
  <circle cx="40" cy="38" r="2.5" fill="#2A2A33"/>
  <!-- Antenne nach hinten (links) -->
  <line x1="12" y1="32" x2="4" y2="32" stroke="#2A2A33" stroke-width="3" stroke-linecap="round"/>
  <circle cx="4" cy="32" r="4" fill="#E8453C" stroke="#2A2A33" stroke-width="2.5"/>
</svg>
